
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Transit Kundali</title>

<style>
:root{
  --bg:#fff8ed;
  --line:#a85d2b;
  --ink:#392514;
  --muted:#806c5b;
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  background:var(--bg);color:var(--ink);
  font-family:Arial,sans-serif;
}
h2{text-align:center;font-size:20px;margin:6px 0}
#time{
  text-align:center;color:var(--muted);
  font-size:13px;margin:8px 0 14px;
}
.controls{
  display:flex;flex-wrap:wrap;
  justify-content:center;align-items:center;
  gap:8px;margin:12px auto;max-width:600px;
}
button,.field{
  border:1px solid var(--line);
  border-radius:6px;padding:9px 12px;
  background:#fff;color:var(--ink);
  font-size:14px;
}
button{cursor:pointer}
.rotate{
  background:#a85d2b;color:white;
  font-weight:bold;min-width:48px;
}
.live{
  background:#c17b16;color:white;
  font-weight:bold;
}
.field{
  display:flex;flex-direction:column;
  gap:5px;font-size:12px;
}
input{
  max-width:145px;width:100%;
  border:0;background:transparent;
  color:var(--ink);font-size:14px;
}
svg{
  display:block;width:100%;height:auto;
  max-width:600px;margin:auto;
}
.frame{fill:none;stroke:var(--line);stroke-width:1.5}
.house{
  font-size:12px;fill:var(--muted);
  text-anchor:middle;
}
.planet{
  font-size:12px;font-weight:bold;
  text-anchor:middle;
}
#status{
  text-align:center;font-size:13px;
  color:var(--muted);margin:12px 0;
}
table{
  width:100%;border-collapse:collapse;
  font-size:13px;margin-top:12px;
}
th,td{
  text-align:left;padding:8px 4px;
  border-bottom:1px solid #e6d4bf;
}
th{color:var(--line)}
</style>
</head>

<body>
<h2>Live Transit Kundali</h2>
<div id="time">गणना हो रही है…</div>

<div class="controls">
  <button class="rotate" onclick="rotateChart(-1)"
          aria-label="Left Rotation">←</button>
  <button class="rotate" onclick="rotateChart(1)"
          aria-label="Right Rotation">→</button>

  <label class="field">
    Date
    <input type="date" id="dateInput">
  </label>

  <label class="field">
    Time
    <input type="time" id="timeInput" step="60">
  </label>

  <button class="live" onclick="liveKundali()">
    Live Kundali
  </button>
</div>

<svg id="chart" viewBox="0 0 400 400"
     aria-label="उत्तर भारतीय लग्न कुंडली">
  <rect class="frame" x="2" y="2" width="396" height="396"/>
  <path class="frame" d="
    M2 2L398 398
    M398 2L2 398
    M200 2L398 200L200 398L2 200Z"/>
  <g id="labels"></g>
</svg>

<div id="status">ग्रहों की स्थिति लोड हो रही है…</div>

<table>
  <thead>
    <tr><th>ग्रह</th><th>राशि</th><th>डिग्री</th></tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

<script>
const signs=[
  "मेष","वृषभ","मिथुन","कर्क","सिंह","कन्या",
  "तुला","वृश्चिक","धनु","मकर","कुंभ","मीन"
];

const planets=[
  ["Sun","सूर्य","#c17b16"],
  ["Moon","चंद्र","#8060b8"],
  ["Mercury","बुध","#526ed6"],
  ["Venus","शुक्र","#d84b70"],
  ["Mars","मंगल","#d94c54"],
  ["Jupiter","गुरु","#a77917"],
  ["Saturn","शनि","#777064"]
];

// मूल कुंडली के 12 स्थान सुरक्षित रखे गए हैं।
const positions=[
  [200,55],[105,60],[45,120],[105,200],
  [45,285],[105,345],[200,345],[295,345],
  [355,285],[295,200],[355,120],[295,60]
];

const NS="http://www.w3.org/2000/svg";
let rotation=0;
let selectedDate=new Date();

function norm(x){
  return ((x%360)+360)%360;
}

// Lahiri ayanamsha का अनुमानित सूत्र।
function ayanamsha(date){
  const y=date.getUTCFullYear()+
    (date.getUTCMonth()+0.5)/12;
  const t=(y-2000)/100;
  return 23.853055+1.3969713*t+
    0.0003086*t*t;
}

function degText(x){
  const d=Math.floor(x);
  const m=Math.floor((x-d)*60);
  const s=Math.floor((x*3600)%60);
  return `${d}° ${m}' ${s}"`;
}

function siderealLongitude(body,date){
  const v=Astronomy.GeoVector(body,date,true);
  return norm(
    Astronomy.Ecliptic(v).elon-ayanamsha(date)
  );
}

// दिल्ली के निर्देशांक से लग्न का अनुमान।
function calculateAscendant(date){
  const jd=date.getTime()/86400000+2440587.5;
  const T=(jd-2451545)/36525;

  const gmst=norm(
    280.46061837+
    360.98564736629*(jd-2451545)+
    0.000387933*T*T-
    T*T*T/38710000
  );

  const longitude=77.2090;
  const latitude=28.6139;
  const theta=(gmst+longitude)*Math.PI/180;
  const phi=latitude*Math.PI/180;

  const epsilon=(23.439291-0.0130042*T)*Math.PI/180;

  const tropical=norm(Math.atan2(
    -Math.cos(theta),
    Math.sin(epsilon)*Math.tan(phi)+
    Math.cos(epsilon)*Math.sin(theta)
  )*180/Math.PI);

  return norm(tropical-ayanamsha(date));
}

function rotateChart(direction){
  rotation=(rotation+direction+12)%12;
  render();
}

function liveKundali(){
  selectedDate=new Date();
  rotation=0;
  setInputs(selectedDate);
  render();
}

function setInputs(date){
  const parts=new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Kolkata",
    year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(date);

  const p={};
  parts.forEach(x=>p[x.type]=x.value);
  document.getElementById("dateInput").value=
    `${p.year}-${p.month}-${p.day}`;

  document.getElementById("timeInput").value=
    new Intl.DateTimeFormat("en-GB",{
      timeZone:"Asia/Kolkata",
      hour:"2-digit",minute:"2-digit",
      hourCycle:"h23"
    }).format(date);
}

function readInputs(){
  const d=document.getElementById("dateInput").value;
  const t=document.getElementById("timeInput").value;
  if(!d||!t)return;

  // चुना गया समय भारतीय मानक समय (IST) में है।
  selectedDate=new Date(`${d}T${t}:00+05:30`);
  rotation=0;
  render();
}

document.getElementById("dateInput")
  .addEventListener("change",readInputs);
document.getElementById("timeInput")
  .addEventListener("change",readInputs);

function render(){
  if(!window.Astronomy){
    document.getElementById("status").textContent=
      "गणना लाइब्रेरी लोड नहीं हुई। इंटरनेट जाँचें।";
    return;
  }

  try{
    const date=selectedDate;
    const asc=calculateAscendant(date);
    const ascSign=Math.floor(asc/30);

    document.getElementById("time").textContent=
      "दिल्ली समय: "+new Intl.DateTimeFormat("en-IN",{
        timeZone:"Asia/Kolkata",
        dateStyle:"medium",timeStyle:"medium"
      }).format(date);

    const data=planets.map(([body,name,color])=>{
      const lon=siderealLongitude(
        Astronomy.Body[body],date
      );
      return {
        name,color,lon,
        sign:Math.floor(lon/30),
        within:lon%30
      };
    });

    // राहु का mean-node अनुमान; केतु राहु से 180°।
    const jd=date.getTime()/86400000+2440587.5;
    const T=(jd-2451545)/36525;
    const ay=ayanamsha(date);
    const rahu=norm(
      125.04452-1934.136261*T+
      0.0020708*T*T+T*T*T/450000-ay
    );
    const ketu=norm(rahu+180);

    data.push({
      name:"राहु",color:"#348c79",
      lon:rahu,sign:Math.floor(rahu/30),
      within:rahu%30
    });
    data.push({
      name:"केतु",color:"#a05bc4",
      lon:ketu,sign:Math.floor(ketu/30),
      within:ketu%30
    });

    // भाव 1 से शुरू होकर राशियाँ क्रम से रखी जाती हैं।
    // Rotation राशियों और उनके ग्रहों को साथ खिसकाता है।
    const houses=Array.from({length:12},()=>[]);
    data.forEach(p=>{
      const actualHouse=norm(p.sign-ascSign)/30;
      const house=Math.floor(actualHouse);
      const displayedHouse=(house+rotation)%12;
      houses[displayedHouse].push(p);
    });

    const g=document.getElementById("labels");
    g.innerHTML="";

    for(let i=0;i<12;i++){
      const [x,y]=positions[i];
      const signIndex=(ascSign+i-rotation+12)%12;

      const h=document.createElementNS(NS,"text");
      h.setAttribute("x",x);
      h.setAttribute("y",y);
      h.setAttribute("class","house");
      h.textContent=
        `${i+1} · ${signs[signIndex]}`;
      g.appendChild(h);

      houses[i].forEach((p,j)=>{
        const el=document.createElementNS(NS,"text");
        el.setAttribute("x",x);
        el.setAttribute("y",y+16+j*14);
        el.setAttribute("class","planet");
        el.setAttribute("fill",p.color);
        el.textContent=p.name;
        g.appendChild(el);
      });
    }

    document.getElementById("rows").innerHTML=
      data.map(p=>`<tr>
        <td>${p.name}</td>
        <td>${signs[p.sign]}</td>
        <td>${degText(p.within)}</td>
      </tr>`).join("");

    document.getElementById("status").textContent=
      `लग्न राशि: ${signs[ascSign]} · Rotation: ${rotation}`;

  }catch(e){
    document.getElementById("status").textContent=
      "गणना में त्रुटि हुई। इंटरनेट और गणना लाइब्रेरी जाँचें।";
    console.error(e);
  }
}

setInputs(selectedDate);
render();
setInterval(()=>{
  // केवल लाइव मोड में वर्तमान समय अपडेट करें।
  if(Math.abs(Date.now()-selectedDate.getTime())<65000){
    selectedDate=new Date();
    setInputs(selectedDate);
    render();
  }
},60000);
</script>
</body>
</html>
