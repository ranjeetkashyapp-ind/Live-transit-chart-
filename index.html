<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Vedic Kundli</title>
<style>
:root{--bg:#fff8ed;--line:#a85d2b;--ink:#392514;--muted:#806c5b}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
h2{font-size:20px;text-align:center;margin:6px 0}
#time{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 16px}
.datetime-controls{display:flex;justify-content:center;align-items:flex-end;flex-wrap:nowrap;gap:10px;margin:0 auto 12px}
.datetime-controls label{display:flex;flex-direction:column;gap:5px;color:var(--muted);font-size:12px;flex:1;min-width:0}
.datetime-controls input{width:100%;min-width:0;background:#fff8ed;color:#392514;border:1px solid #a85d2b;border-radius:6px;padding:8px 4px;font-family:Arial,sans-serif;font-size:14px}
.festival-btn{background:#a85d2b!important;color:#fff!important;border:2px solid #7d3e19!important;padding:12px 16px!important;font-size:15px!important;display:inline-block;max-width:100%;white-space:normal;line-height:1.4;box-shadow:0 2px 5px #0002}
.apply-btn,.rotate-btn{background:#fff8ed;color:#392514;border:1px solid #a85d2b;border-radius:6px;padding:9px 14px;font-size:14px;font-weight:bold;cursor:pointer}
#liveNow{display:inline-block;margin:0 auto 10px}
.live-now-row{text-align:center;margin:0 auto}
.rotate-controls{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:0 auto 12px}
.rotate-btn{padding:9px 16px}
.rotate-btn:active,.apply-btn:active{background:#f0dfca}
svg{display:block;width:100%;height:auto;max-width:600px;margin:auto}
.frame{fill:none;stroke:var(--line);stroke-width:1.5}
.house{font-size:14px;fill:var(--muted);text-anchor:middle}
.lagna-label{font-size:14px;fill:var(--line);text-anchor:middle;font-weight:bold}
.planet{font-size:14px;font-weight:bold;text-anchor:middle}
#status{text-align:center;font-size:13px;color:var(--muted);margin:12px 0}
.kundli-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.kundli-tab{background:#fffdf8;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:10px 6px;font-size:13px;font-weight:bold;cursor:pointer;min-width:0}
.kundli-tab.active{background:var(--line);color:#fff}
.kundli-tab[data-panel="ashtakoot-panel"]{grid-column:1}
.kundli-tab.festival-tab{grid-column:2}
.tab-panel[hidden]{display:none!important}
.panel-note{font-size:12px;line-height:1.5;color:var(--muted);margin:12px 0 0}
.prediction-content{font-size:14px;line-height:1.7}
.prediction-content p{margin:8px 0}
table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:13px;margin-top:12px}
th,td{width:25%;text-align:left;padding:8px 4px;border-bottom:1px solid #e6d4bf;overflow-wrap:anywhere}
th{color:var(--line)}
.details-section{margin-top:22px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fffdf8}
.details-section h3{text-align:center;color:var(--line);font-size:18px;margin:0 0 12px}
.sun-moon-times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 14px}
.sun-moon-time{padding:9px;background:var(--bg);border-radius:7px;min-width:0}
.sun-moon-time .detail-label{font-size:12px;color:var(--muted);text-align:center;font-weight:600}
.sun-moon-time .detail-value{font-size:14px;font-weight:bold;margin-top:5px;text-align:center}
.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.detail-item{padding:10px;background:var(--bg);border-radius:7px;overflow-wrap:anywhere;min-width:0}
.detail-label{color:var(--muted);font-size:12px}
.detail-value{font-size:14px;font-weight:bold;margin-top:5px}
/* केवल संयुक्त सूची की सीधी alignment */
.details-list{display:flex;flex-direction:column;gap:0;width:100%}
.detail-line{display:grid;grid-template-columns:minmax(0,43%) minmax(0,57%);align-items:baseline;column-gap:0;padding:9px 2px;border-bottom:1px solid #e6d4bf;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.detail-line:last-child{border-bottom:none}
.detail-line .detail-label{color:var(--muted);font-size:14px;min-width:0;overflow-wrap:anywhere}
.detail-line .detail-value{font-size:14px;font-weight:bold;margin:0;min-width:0;overflow-wrap:anywhere}
@media(max-width:360px){.datetime-controls{gap:5px}.datetime-controls input{font-size:12px;padding:8px 2px}.apply-btn{padding:9px 10px;font-size:13px}.details-section{padding:10px}.details-grid{gap:6px}.detail-item{padding:7px}.detail-value{font-size:13px}.detail-line{grid-template-columns:minmax(0,43%) minmax(0,57%);font-size:13px}.detail-line .detail-label,.detail-line .detail-value{font-size:13px}}

/* Astro Plus corner branding */
body{position:relative}
.astroplus-brand{position:absolute;top:8px;right:10px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:1px;width:54px;text-align:center;pointer-events:none}
.astroplus-brand img{display:block;width:42px;height:42px;object-fit:contain;border-radius:5px}
.astroplus-brand span{font-size:8px;line-height:1.1;font-weight:800;letter-spacing:.45px;color:#e94b12;white-space:nowrap}
@media(max-width:360px){.astroplus-brand{top:5px;right:5px;width:46px}.astroplus-brand img{width:34px;height:34px}.astroplus-brand span{font-size:7px}}
</style>
</head>
