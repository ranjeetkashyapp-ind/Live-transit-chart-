<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astro Plus | Live Transit Chart</title>
<style>
:root{--bg:#fff;--line:#c79a3b;--ink:#392514;--muted:#806c5b}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}
header{text-align:center;margin:0 auto 12px;max-width:600px}
.logoText{font-weight:700;font-size:22px;margin:4px 0;color:#b58120}
h2{font-size:19px;text-align:center;margin:5px 0 12px}
#time{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 14px}
.controls{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:10px auto 14px}
button,select{font-size:14px;padding:9px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
button{background:#c98217;color:white;font-weight:bold;cursor:pointer}
svg{display:block;width:100%;height:auto;max-width:600px;margin:auto}
.frame{fill:none;stroke:var(--line);stroke-width:2}
.house{font-size:13px;fill:#806c5b;text-anchor:middle}
.planet{font-size:11px;font-weight:bold;text-anchor:middle}
#status{text-align:center;font-size:13px;color:var(--muted);margin:12px 0}
.tableWrap{max-width:600px;margin:auto}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th,td{text-align:left;padding:9px 5px;border-bottom:1px solid #eadfc9}
th{color:#9b6b17}
footer{text-align:center;margin:22px 0 8px;font-size:14px;color:#9b6b17;font-weight:bold}
</style>
</head>
<body>
<header><div class="logoText">Astro Plus</div><h2>Live- Transit- Chart</h2></header>
<div id="time">गणना हो रही है…</div>
<div class="controls">
  <button id="rotateBtn" type="button">Rotate</button>
  <label for="rotation">Rotation:</label>
  <select id="rotation" aria-label="Rotation">
    <option value="0">0°</option><option value="1">30°</option><option value="2">60°</option>
    <option value="3">90°</option><option value="4">120°</option><option value="5">150°</option>
    <option value="6">180°</option><option value="7">210°</option><option value="8">240°</option>
    <option value="9">270°</option><option value="10">300°</option><option value="11">330°</option>
  </select>
</div>
<svg id="chart" viewBox="0 0 400 400" aria-label="उत्तर भारतीय कुंडली">
  <rect class="frame" x="2" y="2" width="396" height="396"/>
  <path class="frame" d="M2 2L398 398 M398 2L2 398 M200 2L398 200L200 398L2 200Z"/>
  <g id="labels"></g>
</svg>
<div id="status" role="status">ग्रहों की स्थिति लोड हो रही है…</div>
<div class="tableWrap">
<table><thead><tr><th>ग्रह</th><th>राशि</th><th>डिग्री</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<footer>Visit astroplus.in</footer>
<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script>
"use strict";
const signs=["मेष","वृषभ","मिथुन","कर्क","सिंह","कन्या","तुला","वृश्चिक","धनु","मकर","कुंभ","मीन"];
const planets=[
 ["Sun","सूर्य","सू","#c17b16"],["Moon","चंद्र","चं","#8060b8"],
 ["Mercury","बुध","बु","#526ed6"],["Venus","शुक्र","शु","#d84b70"],
 ["Mars","मंगल","मं","#d94c54"],["Jupiter","गुरु","गु","#a77917"],
 ["Saturn","शनि","श","#777064"]
];
function ayanamsha(date){
 const y=date.getUTCFullYear()+(date.getUTCMonth()+0.5)/12;
 const t=(y-2000)/100;
 return 23.853055+1.3969713*t+0.0003086*t*t;
}
function norm(x){return ((x%360)+360)%360}
function degText(x){
 const d=Math.floor(x),m=Math.floor((x-d)*60),s=Math.floor((((x-d)*60)-m)*60);
 return `${String(d).padStart(2,"0")}° ${String(m).padStart(2,"0")}′ ${String(s).padStart(2,"0")}″`;
}
function siderealLongitude(body,date){
 const v=Astronomy.GeoVector(body,date,true);
 return norm(Astronomy.Ecliptic(v).elon-ayanamsha(date));
}
// Approximate ascendant for Delhi; exact charting should use a validated ephemeris.
function ascendantLongitude(date){
 const jd=date.getTime()/86400000+2440587.5,T=(jd-2451545)/36525;
 const gmst=norm(280.46061837+360.98564736629*(jd-2451545)+0.000387933*T*T-T*T*T/38710000);
 const lst=(gmst+77.2090)*Math.PI/180;
 const eps=(23.439291-0.0130042*T)*Math.PI/180,lat=28.6139*Math.PI/180;
 const tropical=norm(Math.atan2(-Math.cos(lst),Math.sin(eps)*Math.tan(lat)+Math.cos(eps)*Math.sin(lst))*180/Math.PI);
 return norm(tropical-ayanamsha(date));
}
function makeData(now){
 const ay=ayanamsha(now);
 const data=planets.map(([body,name,short,color])=>{
  const lon=siderealLongitude(Astronomy.Body[body],now);
  return {name,short,color,lon,sign:Math.floor(lon/30),within:lon%30};
 });
 const jd=now.getTime()/86400000+2440587.5,T=(jd-2451545)/36525;
 const rahu=norm(125.04452-1934.136261*T+0.0020708*T*T+T*T*T/450000-ay);
 const ketu=norm(rahu+180);
 data.push({name:"राहु",short:"रा",color:"#348c79",lon:rahu,sign:Math.floor(rahu/30),within:rahu%30});
 data.push({name:"केतु",short:"के",color:"#a05bc4",lon:ketu,sign:Math.floor(ketu/30),within:ketu%30});
 const asc=ascendantLongitude(now);
 data.push({name:"लग्न",short:"ल",color:"#111111",lon:asc,sign:Math.floor(asc/30),within:asc%30,isAsc:true});
 return data;
}
const positions=[
 [200,48],[104,60],[48,120],[104,200],[48,280],[104,340],
 [200,352],[296,340],[352,280],[296,200],[352,120],[296,60]
];
let dataCache=[];
function render(){
 const rotation=Number(document.getElementById("rotation").value);
 const byHouse=Array.from({length:12},()=>[]);
 // Rotate the house/sign display by one slot per step; the planetary longitudes remain unchanged.
 dataCache.forEach(p=>{
  const house=(p.sign-rotation+12)%12;
  byHouse[house].push({...p,displaySign:(p.sign+1),house});
 });
 const g=document.getElementById("labels");g.replaceChildren();
 for(let i=0;i<12;i++){
  const [x,y]=positions[i],items=byHouse[i];
  const signNo=((i+rotation)%12)+1;
  const h=document.createElementNS("http://www.w3.org/2000/svg","text");
  h.setAttribute("x",x);h.setAttribute("y",y);h.setAttribute("class","house");
  h.textContent=String(signNo);g.appendChild(h);
  items.forEach((p,j)=>{
   const el=document.createElementNS("http://www.w3.org/2000/svg","text");
   el.setAttribute("x",x);el.setAttribute("y",y+15+j*13);
   el.setAttribute("class","planet");el.setAttribute("fill",p.color);
   el.textContent=p.short+" "+String(Math.floor(p.within)).padStart(2,"0")+"°";
   g.appendChild(el);
  });
 }
 document.getElementById("rows").innerHTML=dataCache.map(p=>
  `<tr><td style="color:${p.color};font-weight:bold">${p.name}</td><td>${signs[p.sign]}</td><td>${degText(p.within)}</td></tr>`
 ).join("");
}
function calc(){
 if(!window.Astronomy){
  document.getElementById("status").textContent="गणना लाइब्रेरी लोड नहीं हुई। इंटरनेट जाँचकर पेज Refresh करें।";
  return;
 }
 try{
  const now=new Date();
  document.getElementById("time").textContent="दिल्ली समय: "+new Intl.DateTimeFormat("en-IN",{
   timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"medium"
  }).format(now);
  dataCache=makeData(now);render();
  document.getElementById("status").textContent="लाइव ग्रह-स्थिति · अनुमानित Lahiri अयनांश · दिल्ली";
 }catch(e){
  document.getElementById("status").textContent="गणना में त्रुटि हुई। इंटरनेट जाँचें या पेज Refresh करें।";
  console.error(e);
 }
}
document.getElementById("rotateBtn").addEventListener("click",()=>{
 const sel=document.getElementById("rotation");
 sel.value=String((Number(sel.value)+1)%12);render();
});
document.getElementById("rotation").addEventListener("change",render);
calc();setInterval(calc,60000);
</script>
</body>
</html>
