
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Vedic Kundli</title>
<style>
:root {
  --bg:#fff8ed;
  --line:#a85d2b;
  --ink:#392514;
  --muted:#806c5b;
}
*{box-sizing:border-box}
body{
  margin:0;padding:16px;
  background:var(--bg);color:var(--ink);
  font-family:Arial,sans-serif;
}
h2{font-size:20px;text-align:center;margin:6px 0}
#time{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 16px}

/* Date and time controls */
.datetime-controls{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-wrap:wrap;
  gap:10px;
  margin:0 auto 12px;
}
.datetime-controls label{
  display:flex;
  flex-direction:column;
  gap:5px;
  color:var(--muted);
  font-size:12px;
}
.datetime-controls input{
  background:#fff8ed;
  color:#392514;
  border:1px solid #a85d2b;
  border-radius:6px;
  padding:8px;
  font-family:Arial,sans-serif;
  font-size:14px;
  max-width:100%;
  min-width:0;
}
.apply-btn{
  background:#fff8ed;
  color:#392514;
  border:1px solid #a85d2b;
  border-radius:6px;
  padding:9px 14px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.rotate-controls{
  display:flex;
  justify-content:center;
  gap:12px;
  margin:0 auto 12px;
}
.rotate-btn{
  background:#fff8ed;
  color:#392514;
  border:1px solid #a85d2b;
  border-radius:6px;
  padding:9px 16px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}
.rotate-btn:active,.apply-btn:active{
  background:#f0dfca;
}

svg{display:block;width:100%;height:auto;max-width:600px;margin:auto}
.frame{fill:none;stroke:var(--line);stroke-width:1.5}
.house{font-size:12px;fill:var(--muted);text-anchor:middle}
.planet{font-size:12px;font-weight:bold;text-anchor:middle}
#status{text-align:center;font-size:13px;color:var(--muted);margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid #e6d4bf}
th{color:var(--line)}
</style>
</head>
<body>

<h2>Live Vedic Kundli</h2>
<div id="time">गणना हो रही है…</div>

<!-- Calendar and time controls -->
<div class="datetime-controls">
  <label>
    Date / तारीख
    <input type="date" id="chartDate">
  </label>
  <label>
    Time / समय
    <input type="time" id="chartTime" step="60">
  </label>
  <button type="button" class="apply-btn" id="applyDateTime">
    Apply
  </button>
</div>

<!-- Rotation buttons -->
<div class="rotate-controls">
  <button type="button" class="rotate-btn" id="leftRotate">
    ← Left Rotate
  </button>
  <button type="button" class="rotate-btn" id="rightRotate">
    Right Rotate →
  </button>
</div>

<svg id="chart" viewBox="0 0 400 400" aria-label="उत्तर भारतीय कुंडली">
  <rect class="frame" x="2" y="2" width="396" height="396"/>
  <path class="frame" d="M2 2L398 398 M398 2L2 398
    M200 2L398 200L200 398L2 200Z"/>
  <g id="labels"></g>
</svg>

<div id="status">ग्रहों की स्थिति लोड हो रही है…</div>

<table>
<thead><tr><th>ग्रह</th><th>राशि</th><th>डिग्री</th></tr></thead>
<tbody id="rows"></tbody>
</table>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
<script>
const signs=["मेष","वृषभ","मिथुन","कर्क","सिंह","कन्या",
"तुला","वृश्चिक","धनु","मकर","कुंभ","मीन"];

const planets=[
 ["Sun","सूर्य","#c17b16"],
 ["Moon","चंद्र","#8060b8"],
 ["Mercury","बुध","#526ed6"],
 ["Venus","शुक्र","#d84b70"],
 ["Mars","मंगल","#d94c54"],
 ["Jupiter","गुरु","#a77917"],
 ["Saturn","शनि","#777064"]
];

let rotationOffset = 0;
let selectedDateTime = null;

const positions=[
 [200,55],[105,60],[45,120],[105,200],
 [45,285],[105,345],[200,345],[295,345],
 [355,285],[295,200],[355,120],[295,60]
];

// Set the initial date and time to Delhi's current time.
function getDelhiDateTime(){
 const parts=new Intl.DateTimeFormat("en-GB",{
  timeZone:"Asia/Kolkata",
  year:"numeric",
  month:"2-digit",
  day:"2-digit",
  hour:"2-digit",
  minute:"2-digit",
  hourCycle:"h23"
 }).formatToParts(new Date());

 const v={};
 parts.forEach(p=>{v[p.type]=p.value});

 return {
  date:`${v.year}-${v.month}-${v.day}`,
  time:`${v.hour}:${v.minute}`
 };
}

const initialDateTime=getDelhiDateTime();
document.getElementById("chartDate").value=initialDateTime.date;
document.getElementById("chartTime").value=initialDateTime.time;

// Only the rotation direction is reversed.
document.getElementById("leftRotate").addEventListener("click",()=>{
 rotationOffset=(rotationOffset+1)%12;
 calc();
});

document.getElementById("rightRotate").addEventListener("click",()=>{
 rotationOffset=(rotationOffset+11)%12;
 calc();
});

// Apply the selected date and time to the chart.
document.getElementById("applyDateTime").addEventListener("click",()=>{
 const dateValue=document.getElementById("chartDate").value;
 const timeValue=document.getElementById("chartTime").value;

 if(!dateValue || !timeValue){
  document.getElementById("status").textContent=
   "कृपया तारीख और समय दोनों चुनें।";
  return;
 }

 // Interpret the selected time as India Standard Time (UTC+05:30).
 const chosen=new Date(`${dateValue}T${timeValue}:00+05:30`);

 if(Number.isNaN(chosen.getTime())){
  document.getElementById("status").textContent=
   "तारीख या समय सही नहीं है।";
  return;
 }

 selectedDateTime=chosen;
 calc();
});

// Lahiri ayanamsha approximate polynomial, degrees.
function ayanamsha(date){
 const y=date.getUTCFullYear()+
 (date.getUTCMonth()+0.5)/12;
 const t=(y-2000)/100;
 return 23.853055+1.3969713*t+0.0003086*t*t;
}

function norm(x){return ((x%360)+360)%360}

function degText(x){
 const d=Math.floor(x),m=Math.floor((x-d)*60);
 const s=Math.floor((((x-d)*60)-m)*60);
 return `${d}° ${m}' ${s}"`;
}

function siderealLongitude(body,date){
 const v=Astronomy.GeoVector(body,date,true);
 return norm(Astronomy.Ecliptic(v).elon-ayanamsha(date));
}

function calc(){
 if(!window.Astronomy){
  document.getElementById("status").textContent=
   "गणना लाइब्रेरी लोड नहीं हुई। इंटरनेट जाँचकर पेज Refresh करें।";
  return;
 }

 try{
  // Use the selected date/time, or current time until Apply is used.
  const now=selectedDateTime || new Date();

  document.getElementById("time").textContent=
   "कुंडली समय (दिल्ली): "+new Intl.DateTimeFormat("en-IN",{
    timeZone:"Asia/Kolkata",
    dateStyle:"medium",
    timeStyle:"medium"
   }).format(now);

  const ay=ayanamsha(now);

  const data=planets.map(([body,name,color])=>{
   const lon=siderealLongitude(Astronomy.Body[body],now);
   return {name,color,lon,sign:Math.floor(lon/30),within:lon%30};
  });

  // Mean lunar node approximation
  const jd=now.getTime()/86400000+2440587.5;
  const T=(jd-2451545)/36525;
  const rahu=norm(
   125.04452-1934.136261*T+
   0.0020708*T*T+T*T*T/450000
  );

  const rahuLon=norm(rahu-ay);

  data.push({
   name:"राहु",color:"#348c79",lon:rahuLon,
   sign:Math.floor(rahuLon/30),within:rahuLon%30
  });

  const klon=norm(rahuLon+180);

  data.push({
   name:"केतु",color:"#a05bc4",lon:klon,
   sign:Math.floor(klon/30),within:klon%30
  });

  const bySign=Array.from({length:12},()=>[]);
  data.forEach(p=>bySign[p.sign].push(p));

  const g=document.getElementById("labels");
  g.innerHTML="";

  for(let i=0;i<12;i++){
   const target=(i+rotationOffset+12)%12;
   const [x,y]=positions[target];

   const h=document.createElementNS("http://www.w3.org/2000/svg","text");
   h.setAttribute("x",x);
   h.setAttribute("y",y);
   h.setAttribute("class","house");
   h.textContent=String(i+1);
   g.appendChild(h);

   bySign[i].forEach((p,j)=>{
    const el=document.createElementNS("http://www.w3.org/2000/svg","text");
    el.setAttribute("x",x);
    el.setAttribute("y",y+16+(j*14));
    el.setAttribute("class","planet");
    el.setAttribute("fill",p.color);
    el.textContent=p.name;
    g.appendChild(el);
   });
  }

  document.getElementById("rows").innerHTML=data.map(p=>
   `<tr><td>${p.name}</td><td>${signs[p.sign]}</td><td>${degText(p.within)}</td></tr>`
  ).join("");

  document.getElementById("status").textContent=
   "ग्रहों की अनुमानित खगोलीय गणना · Lahiri ayanamsha";

 }catch(e){
  document.getElementById("status").textContent=
   "गणना में त्रुटि हुई। लाइब्रेरी/API जाँच की ज़रूरत है।";
 }
}

calc();
setInterval(calc,60000);
</script>
</body>
</html>
